<!doctype html><html><head><meta charset="utf-8"><title>Afterimage — original film motion</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111513;color:#e5e7dc}body{font-family:Arial,sans-serif}main{width:1600px;height:900px;position:absolute;transform-origin:0 0;background:radial-gradient(ellipse at 75% 40%,#2c3529 0%,#111513 65%)}.rule{position:absolute;left:90px;right:90px;top:75px;height:1px;background:#52604d}.eyebrow{position:absolute;left:90px;top:102px;color:#edbc77;font:16px monospace;letter-spacing:3px}.title{position:absolute;left:90px;top:263px;font-size:104px;font-weight:400;letter-spacing:-5px;line-height:1.05;margin:0}.title em{font-family:Georgia,serif;font-weight:normal;color:#edbc77}.deck{position:absolute;left:95px;top:505px;font:27px/1.6 Georgia,serif;color:#b6c0af;max-width:600px}.foot{position:absolute;bottom:62px;left:92px;font:15px monospace;letter-spacing:1px;color:#a3afa4}.number{position:absolute;right:93px;top:98px;font:16px monospace;color:#a3afa4}.instrument{position:absolute;width:590px;height:440px;right:100px;top:245px;background:linear-gradient(140deg,#48503b,#202b22);border:2px solid #626952;border-radius:20px;padding:45px;box-shadow:30px 45px 70px #0008;transform:perspective(1100px) rotateY(-14deg) rotateX(6deg) rotateZ(-3deg)}.scope{height:260px;background:radial-gradient(ellipse,#333b25,#101914 75%);border:15px solid #161e17;border-radius:18px;box-shadow:0 0 0 1px #697359;position:relative;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#b9c18b12 1px,transparent 1px),linear-gradient(90deg,#b9c18b12 1px,transparent 1px);background-size:30px 30px}.trace{fill:none;stroke:#edbc77;stroke-width:2.5;filter:drop-shadow(0 0 5px #eab16b)}.time{position:absolute;right:20px;bottom:16px;color:#edbc77;font:18px monospace}.dial{position:absolute;bottom:29px;left:50px;width:48px;height:48px;border:7px solid #111b14;border-radius:100%;background:#545d47;box-shadow:3px 5px 9px #0008}.dial:after{content:'';position:absolute;left:17px;top:0;width:2px;height:15px;background:#edbc77}.hardwarelabel{position:absolute;left:122px;bottom:37px;font:11px/1.6 monospace;letter-spacing:1px;color:#bbc0a5}.illustration{position:absolute;right:114px;top:730px;font:12px monospace;color:#899581;letter-spacing:1px}.amberline{position:absolute;left:95px;top:650px;background:#edbc77;width:410px;height:2px;transform-origin:left}.nodes{position:absolute;top:330px;left:95px;right:95px;display:flex;gap:30px;align-items:center}.node{flex:1;padding:35px 20px;border-top:1px solid #7e886e;height:180px}.node b{display:block;color:#edbc77;font:17px monospace;margin-bottom:30px}.node span{font:29px Georgia,serif}.arrow{font:30px Georgia;color:#edbc77}.caution{position:absolute;left:95px;top:625px;font:26px/1.6 Georgia;color:#b6c0af}.methodtitle{top:190px;font-size:69px}.endtitle{top:260px;font-size:76px;line-height:1.2;max-width:1400px;letter-spacing:-3px}.enddeck{top:510px;max-width:1100px}.repo{position:absolute;left:95px;top:665px;font:23px monospace;color:#edbc77}
</style></head><body><main id="stage"></main><script src="gsap.min.js"></script><script>
const s=new URLSearchParams(location.search).get('scene')||'intro';const stage=document.querySelector('#stage');const common='<div class="rule"></div><div class="eyebrow">AFTERIMAGE / A FICTIONAL ARCHIVE</div>';
if(s==='intro'){stage.innerHTML=common+'<div class="number">01 — THE TRACE</div><h1 class="title">Something<br><em>remains.</em></h1><p class="deck">A ghost story with a paper trail.</p><div class="amberline"></div><div class="instrument"><div class="scope"><div class="grid"></div><svg viewBox="0 0 460 230"><path class="trace" d="M0 130H115L131 124L144 139L158 85L174 165L191 117L207 133H460"/></svg><div class="time">02:13</div></div><div class="dial"></div><div class="hardwarelabel">AFTERIMAGE<br>ARCHIVE / SIGNAL STUDY</div></div><div class="illustration">ORIGINAL ILLUSTRATION · NOT HARDWARE</div><div class="foot">Eight records. One question. Read what survives.</div>'}
else if(s==='method'){stage.innerHTML=common+'<div class="number">RETRIEVAL, NOT ANSWERS</div><h1 class="title methodtitle">Follow the record.</h1><div class="nodes"><div class="node"><b>01 / QUESTION</b><span>Search by meaning</span></div><div class="arrow">→</div><div class="node"><b>02 / MINILM</b><span>Rank related passages</span></div><div class="arrow">→</div><div class="node"><b>03 / SOURCE</b><span>Read the exact record</span></div></div><div class="caution">A small fictional archive, not a general benchmark.<br>Temporal questions and misleading assumptions can still fail.</div><div class="foot">Similarity is not confidence. Related does not mean supported.</div>'}
else {stage.innerHTML=common+'<div class="number">KEEP THE SOURCE</div><h1 class="title endtitle">The mystery can remain.<br><em>The source should not disappear.</em></h1><p class="deck enddeck">Afterimage — a ghost story with a paper trail.</p><div class="repo">github.com/sharonbasovich/afterimage</div><div class="foot">Eight fictional maintenance records · Open-model retrieval · Exact sources</div>'}
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`}fit();addEventListener('resize',fit);
const tl=gsap.timeline({paused:true});tl.from('.rule',{scaleX:0,transformOrigin:'left',duration:1.2,ease:'power2.out'},0).from('.eyebrow,.number',{opacity:0,duration:1},.2).from('.title',{y:22,opacity:0,duration:1.8,ease:'power2.out'},.3).from('.deck,.foot,.repo,.caution',{y:12,opacity:0,duration:1.4,stagger:.16},1).from('.amberline',{scaleX:0,duration:2,ease:'power2.inOut'},1.2);
if(s==='intro'){const path=document.querySelector('.trace');const n=path.getTotalLength();gsap.set(path,{strokeDasharray:n,strokeDashoffset:n});tl.from('.instrument',{rotationY:-22,y:15,opacity:0,duration:2},.1).to(path,{strokeDashoffset:0,duration:3.5,ease:'none'},.8).from('.illustration',{opacity:0,duration:1},1.8).to('.instrument',{y:-7,rotationY:-10,duration:6,ease:'sine.inOut'},2)}else if(s==='method'){tl.from('.node',{opacity:0,y:18,stagger:.5,duration:1.2},1).from('.arrow',{opacity:0,stagger:.5,duration:1},2)}
window.film={duration:s==='intro'?10:s==='method'?14:8,seek:t=>tl.seek(t),play:()=>tl.play(0)};window.__FILM_READY__=true;
</script></body></html>
