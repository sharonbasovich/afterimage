name: Source-pinned demo capture
on:
  push:
    branches: ['film/real-browser-capture']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-capture-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Capture source and license metadata (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Check capture JavaScript syntax (not browser execution)
        run: |
          node --check scripts/capture-demo.mjs
          node --check scripts/capture-motion.mjs
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const html=fs.readFileSync('film/motion.html','utf8'); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(s=>s.trim()); if(scripts.length!==1) throw Error('Expected one inline motion script'); scripts.forEach(s=>new vm.Script(s));"
      - name: Verify locked GSAP installation and actual license collection
        run: |
          npm ci --prefix film/motion-deps --ignore-scripts --no-audit --no-fund
          mkdir -p motion-capture
          cp film/motion-deps/package-lock.json motion-capture/gsap-package-lock.json
          cp film/motion-deps/node_modules/gsap/package.json motion-capture/gsap-package.json
          cp film/motion-deps/node_modules/gsap/dist/gsap.min.js motion-capture/gsap.min.js
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const pkg=JSON.parse(fs.readFileSync('motion-capture/gsap-package.json')); const js=fs.readFileSync('motion-capture/gsap.min.js','utf8'); assert.equal(pkg.version,'3.15.0'); assert.match(pkg.license,/gsap.com\/standard-license/); assert.match(js.slice(0,2000),/gsap.com\/standard-license/);"
          sha256sum motion-capture/* > motion-capture/SHA256SUMS.txt
      - name: Preserve license-validation evidence (not footage)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capture-license-validation-${{ github.sha }}
          path: motion-capture/
          retention-days: 7
  capture:
    name: Full real-browser capture (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: capture-code
          sparse-checkout: |
            scripts/capture-demo.mjs
            scripts/capture-motion.mjs
            film/motion.html
            film/motion-deps
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: c38a1bd7c4bdc73a87bdf1bd5dce7bf66f3c6c80
          path: app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build exact source and install real browser
        working-directory: app
        run: |
          npm ci
          npm run setup:browser-assets
          npm run build
          npx playwright install --with-deps chromium
          cp ../capture-code/scripts/capture-demo.mjs scripts/capture-demo.mjs
      - name: Record actual app, real WASM retrieval and exact originals
        working-directory: app
        run: |
          node scripts/capture-demo.mjs
          git rev-parse HEAD > demo-capture/app-source-commit.txt
          cp docs/PINNED-ASSET-SHA256.json demo-capture/
          sha256sum demo-capture/* > demo-capture/SHA256SUMS.txt
      - name: Preserve successful raw application footage before editorial rendering
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-browser-capture-${{ github.sha }}
          path: app/demo-capture/
          retention-days: 7
      - name: Record original GSAP editorial sequences (no model)
        working-directory: app
        run: |
          cp -R ../capture-code/film/motion-deps motion-deps
          npm ci --prefix motion-deps --ignore-scripts --no-audit --no-fund
          mkdir -p motion
          cp ../capture-code/film/motion.html motion/index.html
          cp motion-deps/node_modules/gsap/dist/gsap.min.js motion/gsap.min.js
          cp ../capture-code/scripts/capture-motion.mjs scripts/capture-motion.mjs
          timeout 90s node scripts/capture-motion.mjs
          cp motion-deps/package-lock.json motion-capture/gsap-package-lock.json
          cp motion-deps/node_modules/gsap/package.json motion-capture/gsap-package.json
          cp motion-deps/node_modules/gsap/dist/gsap.min.js motion-capture/gsap.min.js # Includes unmodified license notice and official terms URL.
          sha256sum motion-capture/* > motion-capture/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-browser-capture-${{ github.sha }}
          path: |
            app/demo-capture/
            app/motion-capture/
          retention-days: 7
