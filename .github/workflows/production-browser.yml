name: Production browser verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run setup:browser-assets
      - run: npm run typecheck && npm run typecheck:browser && npm run lint && npm test && npm run test:evaluation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record exact tested source and asset provenance
        run: |
          mkdir -p browser-provenance
          git rev-parse HEAD > browser-provenance/tested-commit.txt
          node --version > browser-provenance/node-version.txt
          cp docs/PINNED-ASSET-SHA256.json browser-provenance/
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            browser-provenance/
          retention-days: 14
