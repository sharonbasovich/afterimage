name: Static deployment verification and Pages
on:
  pull_request:
  push:
    branches: [main]
    # Infrastructure-only preview publication must not rebuild/relabel the root.
    paths-ignore: ['.github/workflows/pages.yml', '.github/workflows/review-pages.yml', 'scripts/compose-review*', 'docs/SUBMITTED-ROOT-008a75b-SHA256.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run setup:browser-assets
      - run: npm run typecheck && npm run typecheck:browser && npm run lint && npm test && npm run test:evaluation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test real WASM under a project directory
        run: npm run test:browser
        env:
          STATIC_PREFIX: /afterimage/
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Record deployable source
        run: |
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/deployment.json
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    # Pull requests only verify/build. No external publication from unmerged code.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled by the repository owner; never auto-enable or alter access.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
