name: Kinetic film editorial render
on:
  push:
    branches: ['film/kinetic-v2']
    paths: ['film/kinetic-v2/**', 'scripts/render-kinetic.mjs', '.github/workflows/kinetic-film.yml']
permissions:
  contents: read
concurrency:
  group: kinetic-film-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify source and render preview or reviewed final
        run: |
          node --check scripts/render-kinetic.mjs
          ffmpeg -version
          npm ci --prefix film/motion-deps --ignore-scripts --no-audit --no-fund
          cp film/motion-deps/node_modules/gsap/dist/gsap.min.js film/kinetic-v2/assets/gsap.min.js
          node scripts/render-kinetic.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kinetic-film-${{ github.sha }}
          path: kinetic-render/
          retention-days: 7
